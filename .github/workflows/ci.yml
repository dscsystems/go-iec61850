name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  fuzz-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Short fuzz on network-facing decoders
        run: |
          for pkg in ./asn1 ./mms ./goose ./sv ./internal/osi/...; do
            for f in $(go test -list 'Fuzz.*' $pkg 2>/dev/null | grep '^Fuzz' || true); do
              go test -run=NONE -fuzz="^$f$" -fuzztime=20s $pkg
            done
          done
