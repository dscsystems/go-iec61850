name: Interop
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Builds libiec61850 and runs the interop suite in both directions:
# our client against the C server, and the C client against our server.
jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Run bidirectional interop
        run: bash interop/run.sh
        env:
          LIBIEC61850_REF: v1.6
