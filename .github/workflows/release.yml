name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: windows, goarch: "386" }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }

      - name: Build
        run: |
          mkdir -p dist
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          for cmd in cmd/*/; do
            name=$(basename "$cmd")
            go build -trimpath -ldflags "-s -w" -o "dist/${name}${ext}" "./$cmd"
          done

      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          archive="go-iec61850_${version}_${GOOS}_${GOARCH}"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip "../${archive}.zip" ./*
          else
            tar czf "../${archive}.tar.gz" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: go-iec61850_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  # The same commands built with the OpenSSL TLS engine (build tag openssl,
  # package iec62351/ossltls), which adds the IEC 62351-4 native-mode suite
  # crypto/tls lacks (TLS_DHE_RSA_WITH_AES_128_GCM_SHA256). cgo needs a
  # native toolchain, so each platform builds on its own runner. On Linux and
  # macOS OpenSSL is linked statically, so the binaries need no libssl or
  # Homebrew. MSYS2 ships only import libraries for OpenSSL, so the Windows
  # archive carries the OpenSSL DLLs next to the executables.
  build-openssl:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so the binaries run on any newer distribution.
          - { os: ubuntu-22.04, goos: linux, goarch: amd64 }
          - { os: ubuntu-22.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-14, goos: darwin, goarch: arm64 }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # MSYS2's MINGW64 shell on Windows (gcc and OpenSSL for cgo).
        shell: ${{ matrix.goos == 'windows' && 'msys2 {0}' || 'bash' }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit # keeps setup-go's Go on PATH
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl mingw-w64-x86_64-pkgconf zip

      - name: OpenSSL (static) for cgo
        run: |
          case "${{ matrix.goos }}" in
            linux)
              sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
              libdir="/usr/lib/$(gcc -dumpmachine)"; incdir=/usr/include; extra="-ldl -pthread" ;;
            darwin)
              brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
              prefix="$(brew --prefix openssl@3)"
              libdir="$prefix/lib"; incdir="$prefix/include"; extra="" ;;
            windows)
              # Go runs gcc and pkg-config as Windows programs: pin MSYS2's
              # (the image also has Strawberry Perl's). MSYS2's OpenSSL
              # libraries are import libraries, so this links the DLLs,
              # which the Build step bundles.
              echo "CC=$(cygpath -m /mingw64/bin/gcc.exe)" >> "$GITHUB_ENV"
              echo "PKG_CONFIG=$(cygpath -m /mingw64/bin/pkg-config.exe)" >> "$GITHUB_ENV"
              pkg-config --cflags --libs libssl
              exit 0 ;;
          esac
          test -f "$libdir/libssl.a" && test -f "$libdir/libcrypto.a"
          # pkg-config files naming the static archives, so the cgo directive
          # "#cgo pkg-config: libssl libcrypto" links them, not shared ones.
          pc="$RUNNER_TEMP/openssl-static"
          mkdir -p "$pc"
          printf 'Name: libcrypto\nDescription: OpenSSL libcrypto (static)\nVersion: 3\nCflags: -I%s\nLibs: %s/libcrypto.a %s\n' \
            "$incdir" "$libdir" "$extra" > "$pc/libcrypto.pc"
          printf 'Name: libssl\nDescription: OpenSSL libssl (static)\nVersion: 3\nRequires: libcrypto\nCflags: -I%s\nLibs: %s/libssl.a\n' \
            "$incdir" "$libdir" > "$pc/libssl.pc"
          pcdir="$pc"
          [ "${{ matrix.goos }}" = windows ] && pcdir="$(cygpath -m "$pc")"
          echo "PKG_CONFIG_LIBDIR=$pcdir" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$pcdir" >> "$GITHUB_ENV"
          PKG_CONFIG_LIBDIR="$pcdir" PKG_CONFIG_PATH="$pcdir" pkg-config --cflags --libs libssl

      - name: Test the OpenSSL engine
        run: go test -tags openssl ./iec62351/ossltls ./mms

      - name: Build
        run: |
          mkdir -p dist
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          for cmd in cmd/*/; do
            name=$(basename "$cmd")
            go build -tags openssl -trimpath -ldflags "-s -w" -o "dist/${name}${ext}" "./$cmd"
          done
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Bundle every MinGW DLL the executables need (OpenSSL and its
            # dependencies), so the archive runs without MSYS2.
            for exe in dist/*.exe; do
              ldd "$exe" | awk '$3 ~ /^\/mingw64\// {print $3}'
            done | sort -u | while read -r dll; do cp "$dll" dist/; done
            ls dist
          fi

      - name: Check how OpenSSL is linked
        run: |
          bin=dist/ied-client
          case "${{ matrix.goos }}" in
            linux) deps=$(ldd "$bin") ;;
            darwin) deps=$(otool -L "$bin") ;;
            windows) bin=dist/ied-client.exe ;;
          esac
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Run with only the system directory on PATH: a DLL missing from
            # the archive stops the executable from starting.
            usage=$(PATH=/c/Windows/System32 "$bin" -h 2>&1 || true)
          else
            echo "$deps"
            if echo "$deps" | grep -Ei 'libssl|libcrypto'; then
              echo "::error::OpenSSL is linked dynamically"; exit 1
            fi
            usage=$("$bin" -h 2>&1 || true)
          fi
          # Captured first: grep -q on a pipe would end the program with SIGPIPE.
          if ! printf '%s\n' "$usage" | grep -q -- -tls-openssl; then
            printf '%s\n' "$usage"
            echo "::error::ied-client does not run or lacks -tls-openssl"; exit 1
          fi

      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          archive="go-iec61850_${version}_${{ matrix.goos }}_${{ matrix.goarch }}_openssl"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "../${archive}.zip" ./*
          else
            tar czf "../${archive}.tar.gz" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: go-iec61850_${{ matrix.goos }}_${{ matrix.goarch }}_openssl
          path: |
            *.tar.gz
            *.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-openssl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
